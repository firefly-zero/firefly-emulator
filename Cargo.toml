[package]
name = "firefly-emulator"
version = "0.5.1"
rust-version = "1.82.0"
edition = "2021"

[dependencies]
# parsing CLI flags
clap = { version = "4.5.4", features = ["derive"] }
# finding the VFS location
directories = "6.0.0"
# accessing peripherals
firefly-hal = { git = "https://github.com/firefly-zero/firefly-hal" }
# firefly-hal = { path = "../../firefly-hal" }
# running the app
firefly-runtime = { path = "../firefly-runtime" }
# drawing custom menus
embedded-graphics = "0.8.1"
# showing frame buffer on the screen
minifb = "0.28.0"
heapless = "0.8.0"
