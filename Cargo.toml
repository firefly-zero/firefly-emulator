[package]
name = "firefly-emulator"
version = "0.10.0"
rust-version = "1.91.0"
edition = "2024"
description = "Desktop emulator for Firefly Zero"
license = "GPL-3.0"
repository = "https://github.com/firefly-zero/firefly-emulator"

[dependencies]
# parsing CLI flags
clap = { version = "4.5.60", features = ["derive"] }
# finding the VFS location
directories = "6.0.0"
# accessing peripherals
firefly-hal = "0.3.3"
# running the app
firefly-runtime = "0.10.1"
# drawing custom menus
embedded-graphics = "0.8.2"
# showing frame buffer on the screen
minifb = "0.28.0"

[patch.crates-io]
firefly-runtime = { git = "https://github.com/Robbepop/firefly-runtime.git", branch = "rf-update-wasmi-to-v2.0.0-beta.1" }

[profile.dev.package.wasmi]
opt-level = 3
codegen-units = 1
