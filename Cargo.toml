[package]
name = "firefly-emulator"
version = "0.14.0"
rust-version = "1.98.1"
edition = "2024"
description = "Desktop emulator for Firefly Zero"
license = "GPL-3.0"
repository = "https://github.com/firefly-zero/firefly-emulator"

[dependencies]
# Parsing CLI flags.
clap = { version = "4.6.6", features = ["derive"] }
# Finding the VFS location.
directories = "6.0.0"
# Accessing peripherals.
firefly-hal = "0.5.3"
# Running the app.
firefly-runtime = "0.14.0"
# Drawing custom menus.
embedded-graphics = "0.8.2"
# Write wav files.
hound = "3.5.1"
# Showing frame buffer on the screen.
# Don't update: 0.29.0 is vibe-coded.
minifb = "0.28.0"
# Play audio through speakers.
rodio = { version = "0.21.1", features = ["playback"] }

[patch.crates-io]
firefly-audio = { path = "../firefly-audio" }
firefly-runtime = { path = "../firefly-runtime" }
firefly-hal = { path = "../firefly-hal" }

# Required to be able to run dev builds without wasmi segfaulting.
[profile.dev]
opt-level = 3
debug-assertions = false
